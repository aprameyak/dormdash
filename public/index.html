<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Bidding - Peer Service Platform</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 28px;
    }

    .user-info {
      text-align: right;
    }

    .user-info p {
      margin: 5px 0;
      font-size: 14px;
    }

    .btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #764ba2;
    }

    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #d0d0d0;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .section h2 {
      margin-bottom: 15px;
      font-size: 20px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .service-card {
      background: #f9f9f9;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 6px;
      border-left: 4px solid #667eea;
    }

    .service-card h3 {
      margin-bottom: 8px;
      color: #667eea;
    }

    .service-info {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .service-info strong {
      color: #333;
    }

    .bid-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    .bid-item {
      background: white;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 4px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bid-offer {
      flex: 1;
    }

    .bid-user {
      font-weight: 500;
      color: #667eea;
    }

    .rating-badge {
      background: #fff3cd;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      margin-left: 8px;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .auth-form {
      max-width: 400px;
      margin: 50px auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Auth Section -->
    <div id="authSection" class="auth-form">
      <div class="section">
        <h2>Welcome to Campus Bidding</h2>
        <div id="authMessage"></div>
        <div class="form-group">
          <label>Email (must be .edu)</label>
          <input type="email" id="authEmail" placeholder="alice@mit.edu">
        </div>
        <div class="form-group">
          <label>Name (optional)</label>
          <input type="text" id="authName" placeholder="Alice Chen">
        </div>
        <div class="form-group">
          <label>University (for new users)</label>
          <select id="authUniversity">
            <option value="">Select...</option>
            <option value="MIT">MIT</option>
            <option value="Stanford">Stanford</option>
            <option value="UC Berkeley">UC Berkeley</option>
            <option value="Harvard">Harvard</option>
          </select>
        </div>
        <button class="btn" onclick="handleLogin()">Login / Register</button>
      </div>
    </div>

    <!-- Main App Section -->
    <div id="appSection" class="hidden">
      <header>
        <h1>🎯 Campus Bidding</h1>
        <div class="user-info">
          <p id="userDisplay"></p>
          <button class="btn btn-secondary btn-small" onclick="handleLogout()">Logout</button>
        </div>
      </header>

      <!-- Post Service -->
      <div class="section">
        <h2>Post a Service Need or Offer</h2>
        <div id="postMessage"></div>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="serviceTitle" placeholder="e.g., Need groceries from Whole Foods">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="serviceDesc" placeholder="Details about what you need or can offer"></textarea>
        </div>
        <div class="form-group">
          <label>Source Location</label>
          <input type="text" id="serviceSource" placeholder="e.g., Whole Foods, Cambridge">
        </div>
        <div class="form-group">
          <label>Destination Location</label>
          <input type="text" id="serviceDest" placeholder="e.g., MIT Dorm 5">
        </div>
        <button class="btn" onclick="handlePostService()">Post Service</button>
      </div>

      <!-- Services Feed -->
      <div class="section">
        <h2>Available Services</h2>
        <div id="servicesContainer"></div>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3001/api';

    async function handleLogin() {
      const email = document.getElementById('authEmail').value;
      const name = document.getElementById('authName').value;
      const university = document.getElementById('authUniversity').value;

      if (!email.includes('.edu')) {
        showMessage('authMessage', 'Please use a .edu email address', 'error');
        return;
      }

      try {
        let res = await fetch(`${API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        if (!res.ok && res.status === 404) {
          if (!name || !university) {
            showMessage('authMessage', 'Please provide name and university to register', 'error');
            return;
          }

          res = await fetch(`${API}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, name, university })
          });
        }

        const data = await res.json();
        if (data.user) {
          localStorage.setItem('user', JSON.stringify(data.user));
          showApp();
          loadServices();
        }
      } catch (error) {
        showMessage('authMessage', 'Login failed: ' + error.message, 'error');
      }
    }

    async function handlePostService() {
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user) return;

      const title = document.getElementById('serviceTitle').value;
      const description = document.getElementById('serviceDesc').value;
      const source_location = document.getElementById('serviceSource').value;
      const destination_location = document.getElementById('serviceDest').value;

      if (!title || !source_location) {
        showMessage('postMessage', 'Please fill in required fields', 'error');
        return;
      }

      try {
        const res = await fetch(`${API}/services`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description, source_location, destination_location })
        });

        const data = await res.json();
        showMessage('postMessage', 'Service posted! 🎉', 'success');
        document.getElementById('serviceTitle').value = '';
        document.getElementById('serviceDesc').value = '';
        document.getElementById('serviceSource').value = '';
        document.getElementById('serviceDest').value = '';
        setTimeout(loadServices, 500);
      } catch (error) {
        showMessage('postMessage', 'Failed to post: ' + error.message, 'error');
      }
    }

    async function loadServices() {
      try {
        const res = await fetch(`${API}/services`);
        const services = await res.json();
        renderServices(services);
      } catch (error) {
        console.error('Failed to load services:', error);
      }
    }

    function renderServices(services) {
      const container = document.getElementById('servicesContainer');
      if (services.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #999;">No services yet. Be the first to post!</p>';
        return;
      }

      container.innerHTML = services.map(s => `
        <div class="service-card">
          <h3>${s.title}</h3>
          <div class="service-info">
            <div><strong>Posted by:</strong> ${s.user_name} (${s.university_name})
              <span class="rating-badge">⭐ ${s.reputation || 0}</span>
            </div>
            <div><strong>Description:</strong> ${s.description}</div>
            <div><strong>From:</strong> ${s.source_location}</div>
            <div><strong>To:</strong> ${s.destination_location}</div>
            <div><strong>Status:</strong> ${s.status}</div>
          </div>
          <div class="bid-section">
            <div style="margin-bottom: 10px;">
              <input type="text" id="bid_${s.id}" placeholder="Your offer (e.g., Can do for $5 or volunteer)" style="margin-bottom: 5px;">
              <button class="btn btn-small" onclick="placeBid(${s.id})">Place Bid</button>
            </div>
            <div id="bids_${s.id}"></div>
          </div>
        </div>
      `).join('');

      services.forEach(s => loadBids(s.id));
    }

    async function loadBids(serviceId) {
      try {
        const res = await fetch(`${API}/services/${serviceId}/bids`);
        const bids = await res.json();
        const container = document.getElementById(`bids_${serviceId}`);
        if (bids.length > 0) {
          container.innerHTML = '<strong>Bids:</strong><br>' + bids.map(b => `
            <div class="bid-item">
              <div class="bid-offer">
                <span class="bid-user">${b.name}</span>: "${b.offer_text}"
                ${b.reputation ? `<span class="rating-badge">⭐ ${b.reputation}</span>` : ''}
              </div>
              ${b.accepted ? '<span style="color: #28a745; font-weight: 500;">✓ Accepted</span>' : ''}
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Failed to load bids:', error);
      }
    }

    async function placeBid(serviceId) {
      const offer_text = document.getElementById(`bid_${serviceId}`).value;
      if (!offer_text) {
        alert('Please enter an offer');
        return;
      }

      try {
        await fetch(`${API}/bids`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ service_id: serviceId, offer_text })
        });

        document.getElementById(`bid_${serviceId}`).value = '';
        loadBids(serviceId);
      } catch (error) {
        alert('Failed to place bid: ' + error.message);
      }
    }

    function showApp() {
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      const user = JSON.parse(localStorage.getItem('user'));
      document.getElementById('userDisplay').innerHTML = `<strong>${user.name}</strong><br>${user.email}<br>Reputation: ⭐ ${user.reputation || 0}`;
    }

    function handleLogout() {
      localStorage.removeItem('user');
      location.reload();
    }

    function showMessage(elementId, message, type) {
      const el = document.getElementById(elementId);
      el.innerHTML = `<div class="message ${type}">${message}</div>`;
      setTimeout(() => el.innerHTML = '', 5000);
    }

    // Auto-login if already logged in
    window.addEventListener('load', () => {
      const user = localStorage.getItem('user');
      if (user) {
        showApp();
        loadServices();
      }
    });
  </script>
</body>
</html>
